<div class="aw-root" id="root" style="padding:24px;"></div>
<script>
(function () {
  var A = window.AgriWin, r = document.getElementById("root");
  var g = document.createElement("div");
  g.style.cssText = "display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;max-width:620px";
  g.appendChild(A.Card({
    tag: "Pépinière", title: "Plants de manguier greffés",
    text: "Greffons sélectionnés, suivis en pépinière jusqu'à la livraison."
  }));
  g.appendChild(A.Card({
    tag: "Formation", title: "Session pratique de plantation",
    text: "Une journée sur le terrain : préparation, mise en terre, entretien."
  }));
  r.appendChild(g);
})();
</script>
