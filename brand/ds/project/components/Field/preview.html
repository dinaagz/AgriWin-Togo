<!-- @dsCard group="Formulaire" height=400 subtitle="Champs, aide, erreur" -->
<div class="aw-root" id="root" style="padding:24px;"></div>
<script>
(function () {
  var A = window.AgriWin, r = document.getElementById("root");
  var g = document.createElement("div");
  g.style.cssText = "display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:640px";
  g.appendChild(A.Field({ label: "Nom complet", id: "f-nom", placeholder: "KEGNON Emmanuel", required: true }));
  g.appendChild(A.Field({ label: "Téléphone", id: "f-tel", type: "tel", value: "+228 96 63 82 00",
                          note: "Nous vous rappelons sous 24 h ouvrées." }));
  g.appendChild(A.Field({ label: "Type de projet", id: "f-type", as: "select",
                          options: ["Pépinière et plants", "Prestation agricole", "Formation", "Élevage"] }));
  g.appendChild(A.Field({ label: "E-mail", id: "f-mail", type: "email", value: "contact@",
                          error: "Adresse incomplète : il manque le domaine." }));
  var full = A.Field({ label: "Votre besoin", id: "f-msg", as: "textarea", rows: 3,
                       placeholder: "Surface, localisation, variétés souhaitées…" });
  full.style.gridColumn = "1 / -1";
  g.appendChild(full);
  r.appendChild(g);
})();
</script>
