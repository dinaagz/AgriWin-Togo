# Cloudflare a exécuté ce dépôt comme un Worker (« npx wrangler deploy »),
# pas comme un Pages classique (« npx wrangler pages deploy ») — voir
# README.md pour changer ça côté tableau de bord si vous préférez du Pages
# pur. En attendant, ce fichier fait marcher les deux :
#
# - « wrangler deploy » (Worker à assets statiques, aucun script requis) lit
#   [assets] ci-dessous et sert site/ directement.
# - « wrangler pages deploy site » lit pages_build_output_dir.
name = "agriwin-togo"
compatibility_date = "2026-09-23"
pages_build_output_dir = "site"

[assets]
directory = "./site"
