<!-- @dsCard height=300 -->
<div style="position:relative;width:960px;height:300px;background:var(--white);overflow:hidden;font-family:var(--font-head)">
  <!--
    Blocs : green-900 (180x300, bord haut et bas perdus) · green-700 (132x168) ·
            gold-500 (132x124) · green-100 (152x196, bord droit perdu) · green-950 (152x96).
    Arrangement : une dalle haute à gauche du champ, deux colonnes de satellites à sa
            droite, coupées par des gouttières space-2 ; l'or reste le plus petit bloc,
            comme il est la plus petite part de la surface d'une page.
    Motif : ligne « motif littéral » — les feuilles de sisal du symbole, réduites à des
            pilules (rx = demi-largeur), parce que la marque est ce plant avant d'être
            une couleur ; deux bouquets, 10 unités, pas de scène ni de silhouette.
    Échelles : gouttières space-2 (8px), coins radius-lg (22px), pilules rx = 7px et 6px.
  -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true"
       style="position:absolute;inset:0">
    <style>
      .b900 { fill: var(--green-900); }
      .b700 { fill: var(--green-700); }
      .b500 { fill: var(--gold-500); }
      .b100 { fill: var(--green-100); }
      .b950 { fill: var(--green-950); }
      .lg   { rx: var(--radius-lg); }
      .blade-light { fill: var(--green-100); }
      .blade-dark  { fill: var(--green-700); }
    </style>
    <rect class="b900" x="480" y="-22" width="180" height="344"/>
    <rect class="b700 lg" x="668" y="0" width="132" height="168"/>
    <rect class="b500 lg" x="668" y="176" width="132" height="124"/>
    <rect class="b100" x="808" y="-22" width="174" height="218"/>
    <rect class="b950 lg" x="808" y="204" width="174" height="118"/>

    <g transform="translate(570 272)">
      <rect class="blade-light" x="-7" y="-206" width="14" height="206" rx="7"
            transform="rotate(-42) scale(1 0.62)"/>
      <rect class="blade-light" x="-7" y="-206" width="14" height="206" rx="7"
            transform="rotate(-28) scale(1 0.80)"/>
      <rect class="blade-light" x="-7" y="-206" width="14" height="206" rx="7"
            transform="rotate(-14) scale(1 0.95)"/>
      <rect class="blade-light" x="-7" y="-212" width="14" height="212" rx="7"/>
      <rect class="blade-light" x="-7" y="-206" width="14" height="206" rx="7"
            transform="rotate(14) scale(1 0.95)"/>
      <rect class="blade-light" x="-7" y="-206" width="14" height="206" rx="7"
            transform="rotate(28) scale(1 0.80)"/>
    </g>

    <g transform="translate(884 178)">
      <rect class="blade-dark" x="-6" y="-134" width="12" height="134" rx="6"
            transform="rotate(-34) scale(1 0.66)"/>
      <rect class="blade-dark" x="-6" y="-134" width="12" height="134" rx="6"
            transform="rotate(-17) scale(1 0.86)"/>
      <rect class="blade-dark" x="-6" y="-140" width="12" height="140" rx="6"/>
      <rect class="blade-dark" x="-6" y="-134" width="12" height="134" rx="6"
            transform="rotate(17) scale(1 0.86)"/>
    </g>
  </svg>

  <div style="position:absolute;left:48px;bottom:40px;width:420px">
    <div style="font-size:88px;line-height:.95;font-weight:800;letter-spacing:-.025em;color:var(--green-950)">AgriWin<br>Togo</div>
    <div style="margin-top:14px;font-family:var(--font-accent);font-style:italic;font-size:14px;color:var(--ink-500)">Votre partenaire agricole !</div>
  </div>
</div>
